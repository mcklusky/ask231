# ask231 on one AWS Lightsail server: Caddy (website + HTTPS) -> Django (API) -> Postgres.
# Run from this folder:  docker compose up -d --build
# Settings come from .env next to this file (copy .env.example).
name: ask231

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ask231}
      POSTGRES_USER: ${DB_USER:-ask231}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-ask231}:${DB_PASSWORD}@db:5432/${DB_NAME:-ask231}
      DJANGO_DEBUG: "False"
      TRUST_X_FORWARDED_PROTO: "True"
      NUM_PROXIES: "1"
    # Apply database changes on every start, then serve. Long timeout for slow photo uploads.
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
             --access-logfile - --error-logfile -"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/lightsail/web.Dockerfile
      args:
        VITE_SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
        VITE_FACEBOOK_URL: ${VITE_FACEBOOK_URL:-}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-}
        VITE_TIKTOK_URL: ${VITE_TIKTOK_URL:-}
        VITE_YOUTUBE_URL: ${VITE_YOUTUBE_URL:-}
        VITE_WHATSAPP_CHANNEL_URL: ${VITE_WHATSAPP_CHANNEL_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
