<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f5c5c" />
  <title>You're offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --blue: #0f5c5c; --red: #b85a24; --bg: #f5f7fb; --fg: #14213d; --muted: #5b6475; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1626; --fg: #eef2f8; --muted: #a3adbf; --card: #17223a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-top: 4px solid var(--red); }
    img { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; font-size: 15px; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>This page needs an internet connection to load. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
